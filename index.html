<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Produksi MSA</title>
  
  <!-- Panggil manifest & warna tema -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3182ce">
  <link rel="apple-touch-icon" href="logo-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    /* Hilangkan margin agar iframe full screen 100% tanpa sisa pinggiran */
    html, body { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; background-color: #f4f7f6; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- MASUKKAN LINK GOOGLE APPS SCRIPT KAMU DI SRC DI BAWAH INI -->
  <iframe src="https://script.google.com/macros/s/AKfycbwokLsX13U36udwLAiX6WS0XtM8Wg2zINSpsEYDVhx3gvJCmM_W1zbDnuFtd3BRx3Mo/exec" allow="fullscreen"></iframe>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('SW berhasil:', reg.scope))
          .catch((err) => console.log('SW gagal:', err));
      });
    }
  </script>
</body>
</html>
